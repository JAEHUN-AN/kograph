name: kograph

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: kograph-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-admin-change-me}
      APP_USER: ${ORACLE_USER:-kograph}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-change-me-local-only}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5.24-community
    container_name: kograph-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-local-only}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

  postgres:
    image: pgvector/pgvector:pg16
    container_name: kograph-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-kograph}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kograph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:2.10.3-python3.12
    container_name: kograph-airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"   # host 8080은 로컬 Spring Boot API가 사용 중
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${POSTGRES_USER:-kograph}:${POSTGRES_PASSWORD:-change-me-local-only}@postgres:5432/airflow
      PYTHONPATH: /opt/kograph/src
      DART_API_KEY: ${DART_API_KEY}
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${ORACLE_USER:-kograph}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change-me-local-only}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./src:/opt/kograph/src
      - ./data:/opt/kograph/data
    # 주의: 스케줄러는 db migrate "이후"에 떠야 한다. `(... &)` 서브셸로
    # 백그라운드 기동한 뒤 웹서버를 포그라운드 프로세스로 유지.
    command: >-
      bash -c "pip install --no-cache-dir oracledb pykrx tenacity pydantic pydantic-settings requests
      && airflow db migrate
      && (airflow users create --username admin --password admin --firstname a --lastname a --role Admin --email admin@localhost || true)
      && (airflow scheduler &)
      && exec airflow webserver -p 8080"

  kograph-mcp:
    build: .
    image: kograph-mcp:dev
    container_name: kograph-mcp
    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ORACLE_HOST: oracle
      ORACLE_PORT: "1521"
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${ORACLE_USER:-kograph}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-kograph}
      POSTGRES_USER: ${POSTGRES_USER:-kograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-local-only}
      DART_API_KEY: ${DART_API_KEY:-unused-at-serving-time}
      KOGRAPH_EMBED_BACKEND: onnx-int8
      KOGRAPH_ONNX_DIR: /models/bge-m3-onnx
    volumes:
      # 모델은 이미지에 굽지 않고 읽기 전용으로 마운트한다 (이미지 913MB 유지)
      - ./models:/models:ro

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: kograph-prometheus
    depends_on:
      - kograph-mcp
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.5.1
    container_name: kograph-grafana
    depends_on:
      - prometheus
    ports:
      - "3001:3000"   # host 3000은 로컬의 다른 프로세스가 사용 중
    environment:
      # 로컬 개발 전용. 외부에 노출할 때는 반드시 인증을 켠다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  oracle-data:
  neo4j-data:
  postgres-data:
  prometheus-data:
  grafana-data:

apiVersion: v1
kind: ConfigMap
metadata:
  name: kograph-config
data:
  ORACLE_HOST: oracle
  ORACLE_PORT: "1521"
  ORACLE_SERVICE: FREEPDB1
  ORACLE_USER: kograph
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: kograph
  POSTGRES_USER: kograph
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  # torch가 없는 이미지이므로 ONNX가 유일한 백엔드다
  KOGRAPH_EMBED_BACKEND: onnx-int8
  KOGRAPH_ONNX_DIR: /models/bge-m3-onnx
---
apiVersion: v1
kind: Secret
metadata:
  name: kograph-secrets
type: Opaque
stringData:
  # 실제 값은 커밋하지 않는다. 배포 전에 아래 중 하나로 대체한다:
  #   kubectl create secret generic kograph-secrets \
  #     --from-literal=ORACLE_PASSWORD=... --from-literal=POSTGRES_PASSWORD=... \
  #     --from-literal=NEO4J_PASSWORD=... --dry-run=client -o yaml | kubectl apply -f -
  # 또는 External Secrets Operator / Sealed Secrets 사용.
  ORACLE_PASSWORD: REPLACE_ME
  POSTGRES_PASSWORD: REPLACE_ME
  NEO4J_PASSWORD: REPLACE_ME
  # 서빙 시점에는 쓰지 않지만 설정 검증이 존재를 요구한다
  DART_API_KEY: unused-at-serving-time

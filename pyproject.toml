[project]
name = "kograph"
version = "0.1.0"
description = "GraphRAG agent & MCP server for Korean equity markets. DART filings -> knowledge graph -> multi-hop financial reasoning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "oracledb>=2.4",
    "pykrx>=1.0.45",
    "tenacity>=9.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.5"]
graph = ["neo4j>=5.23", "anthropic>=0.40"]
rag = [
    "sentence-transformers>=3.0",  # 로컬 CPU 임베딩 (GPU 불필요)
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
]
agent = ["langgraph>=0.2", "langchain-anthropic>=0.2"]
onnx = [
    "onnxruntime>=1.19",              # CPU 추론 백엔드
    "optimum[onnxruntime]>=1.23",     # ONNX 변환 + 동적 양자화
]
# 서빙 전용 — torch/sentence-transformers를 뺀다.
# OnnxEmbedder는 onnxruntime + 토크나이저만 쓰므로 학습 스택이 필요 없고,
# 그 차이가 이미지 크기에서 GB 단위로 나타난다 (notes/004).
serve = [
    "onnxruntime>=1.19",
    "transformers>=4.40",             # 토크나이저만 사용
    "neo4j>=5.23",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "mcp>=1.1",
    "prometheus-client>=0.21",
]
mcp = [
    "mcp>=1.1",
    "prometheus-client>=0.21",  # /metrics 노출 (HTTP 전송 시)
]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kograph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
